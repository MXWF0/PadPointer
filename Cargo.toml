[package]
name = "padpointer"
version = "0.1.3"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "system-tray", "accessibility", "unstable-winit-030"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_Input_XboxController", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_Storage_FileSystem",
  "Win32_Security", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"
] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"



[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }

